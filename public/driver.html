<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Driver Dashboard</title>
<link rel="stylesheet" href="/style.css?v=7">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/driver.css?v=7">
</head>
<body class="driver">
<header class="dh"><div class="wrap"><div class="brand"><span class="logo"><span class="logo-jo">JO</span><span class="logo-t">Taxi Cab</span></span><small>Driver</small></div><nav><span id="conn" title="Live alert connection"></span><a href="#" id="logout" class="hidden"><svg class="ic"><use href="/img/icons.svg#logout"/></svg>Logout</a></nav></div></header>

<div id="loginView" class="wrap login hidden">
  <div class="logo" style="width:100%"><span class="logo-jo">JO</span><span class="logo-t">Taxi Cab</span></div>
  <div class="card"><h2>Driver login</h2>
    <form id="loginForm"><label>Username<span class="field"><svg class="ic"><use href="/img/icons.svg#user"/></svg><input name="username" autocomplete="username" required></span></label>
    <label>Password<span class="field"><svg class="ic"><use href="/img/icons.svg#shield"/></svg><input name="password" type="password" autocomplete="current-password" required></span></label>
    <button class="btn block"><svg class="ic"><use href="/img/icons.svg#logout"/></svg>Log in</button></form><div id="loginMsg"></div></div>
</div>

<div id="app" class="hidden">
  <div class="tabs" id="tabs">
    <button data-tab="requests" class="on"><svg class="ic"><use href="/img/icons.svg#bell"/></svg>Requests<span class="dot hidden" id="pendDot">0</span></button>
    <button data-tab="schedule"><svg class="ic"><use href="/img/icons.svg#calendar"/></svg>Schedule</button>
    <button data-tab="analytics"><svg class="ic"><use href="/img/icons.svg#chart"/></svg>Analytics</button>
    <button data-tab="history"><svg class="ic"><use href="/img/icons.svg#list"/></svg>Rides &amp; bills</button>
  </div>
  <div class="wrap" style="padding-top:18px;padding-bottom:44px">
    <div id="alertBar" class="msg ok hidden"><svg class="ic"><use href="/img/icons.svg#bell"/></svg><button class="btn sm green" id="enableAlerts">Enable sound &amp; notifications for new bookings</button></div>
    <div id="tab-requests"></div>
    <div id="tab-schedule" class="hidden"></div>
    <div id="tab-analytics" class="hidden"></div>
    <div id="tab-history" class="hidden"></div>
  </div>
</div>

<dialog id="billDlg">
  <h2><svg class="ic"><use href="/img/icons.svg#receipt"/></svg><span id="billTitle">Create bill</span></h2>
  <form id="billForm" autocomplete="off">
    <div id="custSummary" class="muted hidden" style="margin-bottom:10px"></div>
    <div id="custFields" class="hidden">
      <label>Customer name *<span class="field"><svg class="ic"><use href="/img/icons.svg#user"/></svg><input name="cname" autocomplete="off"></span></label>
      <div class="row">
        <label>Pickup point *<span class="field"><svg class="ic"><use href="/img/icons.svg#pin"/></svg><input name="cpick" autocomplete="off"></span></label>
        <label>Drop point *<span class="field"><svg class="ic"><use href="/img/icons.svg#route"/></svg><input name="cdrop" autocomplete="off"></span></label>
      </div>
    </div>
    <label>Customer WhatsApp number *<span class="field"><svg class="ic"><use href="/img/icons.svg#whatsapp"/></svg><input name="wa" type="tel" required placeholder="98765 43210"></span></label>

    <div class="seg" id="modeSeg"><button type="button" data-mode="km" class="on"><svg class="ic"><use href="/img/icons.svg#route"/></svg>Per km + extras</button><button type="button" data-mode="fixed"><svg class="ic"><use href="/img/icons.svg#rupee"/></svg>Fixed amount</button></div>

    <div id="modeKm">
      <div class="row">
        <label>Distance (km)<input name="km" type="number" min="0" step="any" inputmode="decimal"></label>
        <label>Rate per km<input name="rate" type="number" min="0" step="any" inputmode="decimal"></label>
      </div>
      <label>Base / minimum fare <span class="muted">(optional)</span><input name="base" type="number" min="0" step="any" inputmode="decimal"></label>
      <div class="muted" style="font-size:13px;margin-bottom:6px">Extras (toll, parking, waiting…)</div>
      <table class="items"><tbody id="extraRows"></tbody></table>
      <div class="chips" style="margin:8px 0 14px">
        <button type="button" class="chip" data-extra="Toll">+ Toll</button><button type="button" class="chip" data-extra="Parking">+ Parking</button>
        <button type="button" class="chip" data-extra="Waiting charge">+ Waiting</button><button type="button" class="chip" data-extra="Night charge">+ Night</button><button type="button" class="chip" data-extra="">+ Other</button>
      </div>
    </div>
    <div id="modeFixed" class="hidden">
      <div class="row">
        <label>Description<input name="fdesc" value="Cab fare"></label>
        <label>Amount<input name="famt" type="number" min="0" step="any" inputmode="decimal"></label>
      </div>
    </div>

    <div class="row">
      <label>Tax %<input name="tax" type="number" min="0" max="50" step="0.01" value="0"></label>
      <label>Payment<select name="pay"><option>Cash</option><option>UPI</option><option>Card</option><option>Pending</option></select></label>
    </div>
    <div class="billtotal" id="billTotal"></div>
    <div id="billMsg"></div>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn sec" id="billCancel">Close</button><button class="btn green" id="billSave"><svg class="ic"><use href="/img/icons.svg#whatsapp"/></svg>Create bill</button></div>
  </form>
</dialog>
<button class="fab-bill hidden" id="fabBill" title="Create a bill for a ride not booked on the website"><svg class="ic"><use href="/img/icons.svg#plus"/></svg><span>New bill</span></button>
<div id="toast" class="hidden"></div>
<script src="/driver.js?v=7"></script>
</body>
</html>
