<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Driver Dashboard</title>
<link rel="stylesheet" href="/style.css">
<style>
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:9}
.tabs button{border:0;background:none;padding:14px 16px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--amber)}
.tabs .dot{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:4px}
.stat{text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--muted);font-size:13px}
.ride{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.ride .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.day{margin:18px 0 8px;font-weight:700;color:var(--amber-d)}
.warn{color:var(--red);font-size:13px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:2px;height:140px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--amber);min-height:1px;border-radius:2px 2px 0 0;position:relative}
.bars div.b2{background:#93c5fd}
.legend{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.hbar{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.hbar i{display:block;height:10px;background:var(--amber);border-radius:5px}
table.items{width:100%}table.items td{padding:2px}table.items input{margin:0;padding:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;background:var(--ink);color:#fff;padding:14px 18px;border-radius:12px;z-index:50;max-width:92%;box-shadow:0 8px 24px rgba(0,0,0,.35)}
dialog{border:0;border-radius:14px;padding:20px;width:min(560px,94vw);max-height:90vh}dialog::backdrop{background:rgba(0,0,0,.5)}
.login{max-width:360px;margin:60px auto}
</style>
</head>
<body>
<header class="site"><div class="wrap"><b>🚖 Driver Dashboard</b><nav><span id="conn" title="Live alert connection">⚪</span><a href="#" id="logout" class="hidden">Logout</a></nav></div></header>

<div id="loginView" class="wrap login hidden">
  <div class="card"><h2>Driver login</h2>
    <form id="loginForm"><label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn block">Log in</button></form><div id="loginMsg"></div></div>
</div>

<div id="app" class="hidden">
  <div class="tabs" id="tabs">
    <button data-tab="requests" class="on">Requests<span class="dot hidden" id="pendDot">0</span></button>
    <button data-tab="schedule">Schedule</button>
    <button data-tab="analytics">Analytics</button>
    <button data-tab="history">All rides &amp; bills</button>
  </div>
  <div class="wrap" style="padding-top:16px;padding-bottom:40px">
    <div id="alertBar" class="msg ok hidden">🔔 <button class="btn sm" id="enableAlerts">Enable sound &amp; notifications for new bookings</button></div>
    <div id="tab-requests"></div>
    <div id="tab-schedule" class="hidden"></div>
    <div id="tab-analytics" class="hidden"></div>
    <div id="tab-history" class="hidden"></div>
  </div>
</div>

<dialog id="billDlg">
  <h2 style="margin-top:0">Generate bill</h2>
  <div id="billFor" class="muted" style="margin-bottom:10px"></div>
  <form id="billForm">
    <table class="items"><tbody id="billItems"></tbody></table>
    <button type="button" class="btn sm sec" id="addItem">+ Add item</button>
    <div class="row" style="margin-top:12px">
      <label>Tax %<input name="tax" type="number" min="0" max="50" step="0.01" value="0"></label>
      <label>Payment<select name="pay"><option>Cash</option><option>UPI</option><option>Card</option><option>Pending</option></select></label>
    </div>
    <div style="font-size:18px;font-weight:700;text-align:right" id="billTotal"></div>
    <div id="billMsg"></div>
    <div class="actions" style="justify-content:flex-end"><button type="button" class="btn sec" id="billCancel">Close</button><button class="btn green" id="billSave">Create &amp; send bill</button></div>
  </form>
</dialog>
<div id="toast" class="hidden"></div>
<script src="/driver.js"></script>
</body>
</html>
